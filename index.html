<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kopa TV Remote</title>
  <style>
    body { background: #0b0b0e; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
    h2 { margin: 5px 0; font-size: 1.2rem; color: #e50914; }
    #status { font-size: 0.8rem; color: #888899; margin-bottom: 20px; }
    .pad { display: grid; grid-template-columns: 80px 80px 80px; grid-template-rows: 80px 80px 80px; gap: 12px; align-items: center; justify-content: center; }
    button { background: #1c1c24; color: #fff; border: 1px solid rgba(255,255,255,0.1); font-size: 1.5rem; border-radius: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
    button:active { background: #e50914; border-color: #ff1e2b; transform: scale(0.95); }
    .up { grid-column: 2; grid-row: 1; }
    .left { grid-column: 1; grid-row: 2; }
    .select { grid-column: 2; grid-row: 2; background: #e50914; font-size: 1rem; font-weight: bold; }
    .right { grid-column: 3; grid-row: 2; }
    .down { grid-column: 2; grid-row: 3; }
    .actions { display: flex; gap: 15px; margin-top: 25px; }
    .btn-action { width: 110px; height: 45px; font-size: 0.9rem; border-radius: 12px; }
  </style>
</head>
<body>

  <h2>KOPA REMOTE</h2>
  <div id="status">Connecting to TV...</div>

  <div class="pad">
    <button class="up" onclick="sendCmd('KEY_UP')">▲</button>
    <button class="left" onclick="sendCmd('KEY_LEFT')">◀</button>
    <button class="select" onclick="sendCmd('KEY_SELECT')">OK</button>
    <button class="right" onclick="sendCmd('KEY_RIGHT')">▶</button>
    <button class="down" onclick="sendCmd('KEY_DOWN')">▼</button>
  </div>

  <div class="actions">
    <button class="btn-action" onclick="sendCmd('KEY_BACK')">Back</button>
    <button class="btn-action" onclick="sendCmd('KEY_HOME')">Home</button>
  </div>

  <!-- PeerJS Library -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const roomKey = urlParams.get('id') || 'KOPA_TV_ROOM';

    const peer = new Peer();
    let conn = null;

    peer.on('open', () => {
      document.getElementById('status').innerText = "Linking to Room: " + roomKey;
      conn = peer.connect(roomKey);

      conn.on('open', () => {
        document.getElementById('status').innerText = "Connected to TV ✅";
        document.getElementById('status').style.color = "#00e676";
      });

      conn.on('error', () => {
        document.getElementById('status').innerText = "Connection failed. Rescanning...";
      });
    });

    function sendCmd(type) {
      if (conn && conn.open) {
        conn.send({ type: type });
        if (navigator.vibrate) navigator.vibrate(40); // Haptic feedback on phone
      } else {
        document.getElementById('status').innerText = "Not connected! Reconnecting...";
        conn = peer.connect(roomKey);
      }
    }
  </script>
</body>
</html>
