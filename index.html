<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>KOPA TV Remote</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; user-select: none; }
    body {
      margin: 0; padding: 16px;
      background: #0f1015; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; min-height: 100vh;
    }
    .remote-card {
      width: 100%; max-width: 360px;
      background: #181920; border-radius: 24px;
      padding: 20px; border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex; flex-direction: column; gap: 20px; align-items: center;
    }
    .status-bar {
      font-size: 13px; color: #888899; display: flex; align-items: center; gap: 8px;
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ff4b4b; }
    .status-dot.connected { background: #00e676; }
    
    /* D-PAD STYLING */
    .dpad-container {
      position: relative; width: 220px; height: 220px;
      background: #222430; border-radius: 50%;
      display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.5), 0 4px 12px rgba(0,0,0,0.4);
    }
    .dpad-btn {
      background: transparent; border: none; color: #ffffff;
      font-size: 20px; font-weight: bold; cursor: pointer;
      display: flex; justify-content: center; align-items: center;
    }
    .dpad-btn:active { background: rgba(255, 255, 255, 0.15); }
    .dpad-up { grid-column: 2; grid-row: 1; border-radius: 100px 100px 0 0; }
    .dpad-down { grid-column: 2; grid-row: 3; border-radius: 0 0 100px 100px; }
    .dpad-left { grid-column: 1; grid-row: 2; border-radius: 100px 0 0 100px; }
    .dpad-right { grid-column: 3; grid-row: 2; border-radius: 0 100px 100px 0; }
    .dpad-center {
      grid-column: 2; grid-row: 2;
      background: #5865F2; border-radius: 50%;
      font-size: 14px; letter-spacing: 0.5px;
      box-shadow: 0 2px 8px rgba(88, 101, 242, 0.5);
    }
    .dpad-center:active { background: #4752c4; }

    /* ACTION BUTTONS */
    .action-row { display: flex; gap: 12px; width: 100%; }
    .action-btn {
      flex: 1; padding: 12px; background: #2a2c3a; color: #ccc;
      border: none; border-radius: 12px; font-weight: 600; cursor: pointer;
    }
    .action-btn:active { background: #3b3e52; color: #fff; }

    /* VOLUME SLIDER */
    .volume-container { width: 100%; display: flex; flex-direction: column; gap: 8px; }
    .volume-header { display: flex; justify-content: space-between; font-size: 13px; color: #aaa; }
    input[type=range] {
      width: 100%; accent-color: #5865F2; height: 6px; background: #2a2c3a; border-radius: 4px;
    }

    /* MEDIA SEARCH INPUT */
    .search-box { display: flex; gap: 8px; width: 100%; }
    .search-box input {
      flex: 1; padding: 10px 14px; background: #222430; border: 1px solid #333;
      border-radius: 10px; color: #fff; outline: none; font-size: 14px;
    }
    .search-box button {
      padding: 10px 16px; background: #E50914; color: #fff; border: none;
      border-radius: 10px; font-weight: bold; cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="remote-card">
    <div class="status-bar">
      <div id="dot" class="status-dot"></div>
      <span id="statusText">Connecting to TV...</span>
    </div>

    <!-- D-PAD & CENTER SELECT -->
    <div class="dpad-container">
      <button class="dpad-btn dpad-up" onclick="sendCmd('KEY_UP')">▲</button>
      <button class="dpad-btn dpad-left" onclick="sendCmd('KEY_LEFT')">◄</button>
      <button class="dpad-btn dpad-center" onclick="sendCmd('KEY_SELECT')">OK</button>
      <button class="dpad-btn dpad-right" onclick="sendCmd('KEY_RIGHT')">►</button>
      <button class="dpad-btn dpad-down" onclick="sendCmd('KEY_DOWN')">▼</button>
    </div>

    <!-- AUX NAVIGATION -->
    <div class="action-row">
      <button class="action-btn" onclick="sendCmd('KEY_BACK')">← Back</button>
      <button class="action-btn" onclick="sendCmd('KEY_HOME')">⌂ Home</button>
    </div>

    <!-- VOLUME CONTROL SLIDER -->
    <div class="volume-container">
      <div class="volume-header">
        <span>🔊 Device Volume</span>
        <span id="volVal">100%</span>
      </div>
      <input type="range" id="volSlider" min="0" max="100" value="100" oninput="onVolumeChange(this.value)">
    </div>

    <!-- MEDIA SEARCH / PLAY LINK -->
    <div class="search-box">
      <input type="text" id="mediaInput" placeholder="Search YouTube or paste URL..." />
      <button onclick="sendMedia()">Play</button>
    </div>
  </div>

<script>
  let peer = new Peer();
  let conn = null;

  // TV Connection setup via URL param (e.g. index.html?id=KOPA_TV_ROOM)
  const urlParams = new URLSearchParams(window.location.search);
  const tvPeerId = urlParams.get('id') || 'KOPA_TV_DEFAULT';

  peer.on('open', () => {
    connectToTV();
  });

  function connectToTV() {
    conn = peer.connect(tvPeerId);
    conn.on('open', () => {
      document.getElementById('dot').classList.add('connected');
      document.getElementById('statusText').innerText = 'Connected to KopaHub TV';
    });
    conn.on('close', () => {
      document.getElementById('dot').classList.remove('connected');
      document.getElementById('statusText').innerText = 'Disconnected';
    });
  }

  function sendCmd(type, data = null) {
    if (conn && conn.open) {
      conn.send({ type, data });
    }
  }

  function onVolumeChange(val) {
    document.getElementById('volVal').innerText = val + '%';
    sendCmd('SET_VOLUME', parseInt(val));
  }

  function sendMedia() {
    const val = document.getElementById('mediaInput').value;
    if (val) {
      sendCmd('PLAY_MEDIA', val);
    }
  }
</script>
</body>
</html>
