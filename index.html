<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>KopaHub Mobile Remote</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; touch-action: none; margin: 0; padding: 0; user-select: none; }
    body { background: #0f0f12; color: #fff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; padding: 10px; }
    header { padding: 12px; text-align: center; background: #1a1a24; font-weight: bold; font-size: 16px; color: #7289da; border-radius: 12px; margin-bottom: 10px; }
    #trackpad { flex: 1; background: #14141d; border-radius: 16px; border: 2px dashed #2a2a38; display: flex; align-items: center; justify-content: center; color: #666; text-align: center; padding: 10px; font-weight: 500; }
    #typing-preview { margin: 10px 0 5px 0; font-size: 14px; color: #4e5058; min-height: 20px; font-style: italic; }
    input { padding: 14px; border-radius: 10px; border: 1px solid #2a2a38; background: #18191c; color: white; font-size: 16px; margin-bottom: 10px; user-select: text; touch-action: auto; }
    input:focus { border-color: #5865F2; outline: none; }
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button { background: #2a2a38; color: white; border: none; padding: 16px; font-size: 16px; font-weight: bold; border-radius: 12px; cursor: pointer; }
    button:active { background: #5865F2; transform: scale(0.98); }
    .kopa-btn { grid-column: span 2; background: #5865F2; }
    .danger-btn { background: #d32f2f; }
    .danger-btn:active { background: #b71c1c; }
  </style>
</head>
<body>
  <header id="status">Connecting to KopaHub...</header>

  <div id="trackpad">TRACKPAD<br><span style="font-size: 12px; color: #444;">Drag finger to move virtual mouse</span></div>

  <div id="typing-preview">Last typed: <span id="typed-text" style="color: #5865F2;">None</span></div>
  <input type="text" id="keyboard" placeholder="Tap to type text to TurboWarp..." />

  <div class="controls">
    <button id="leftClick">🖱️ Left Click</button>
    <button id="rightClick">👆 Right Click</button>
    <button id="kopaBtn" class="kopa-btn">🚀 Open KOPA App</button>
    <button id="disconnectBtn" class="danger-btn">🔌 Disconnect</button>
    <button id="shutdownBtn" class="danger-btn">🛑 Power Off KOPA</button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const hostId = urlParams.get('room');
    const peer = new Peer();
    let conn = null;

    peer.on('open', () => {
      if (hostId) {
        conn = peer.connect(hostId);
        conn.on('open', () => {
          document.getElementById('status').innerText = "🟢 Connected to KopaHub";
        });
        conn.on('close', () => {
          document.getElementById('status').innerText = "🔴 Disconnected";
          document.getElementById('status').style.background = "#d32f2f";
        });
      }
    });

    // Trackpad Logic
    const pad = document.getElementById('trackpad');
    let lastX = 0, lastY = 0;

    pad.addEventListener('touchstart', e => {
      lastX = e.touches[0].clientX;
      lastY = e.touches[0].clientY;
    });

    pad.addEventListener('touchmove', e => {
      if (!conn || !conn.open) return;
      const deltaX = e.touches[0].clientX - lastX;
      const deltaY = e.touches[0].clientY - lastY;
      lastX = e.touches[0].clientX;
      lastY = e.touches[0].clientY;

      conn.send({ type: 'MOVE', dx: deltaX * 1.5, dy: deltaY * 1.5 });
    });

    // Tap trackpad to left-click
    pad.addEventListener('click', () => {
      if (conn && conn.open) conn.send({ type: 'CLICK', button: 'left' });
    });

    // Click Buttons
    document.getElementById('leftClick').onclick = () => conn?.send({ type: 'CLICK', button: 'left' });
    document.getElementById('rightClick').onclick = () => conn?.send({ type: 'CLICK', button: 'right' });
    document.getElementById('kopaBtn').onclick = () => conn?.send({ type: 'REDIRECT_KOPA' });

    // Danger Buttons
    document.getElementById('disconnectBtn').onclick = () => {
      if (conn && conn.open) {
        conn.send({ type: 'DISCONNECT' });
        setTimeout(() => { peer.destroy(); document.getElementById('status').innerText = "🔌 Phone Disconnected"; }, 200);
      }
    };

    document.getElementById('shutdownBtn').onclick = () => {
      if (conn && conn.open) {
        conn.send({ type: 'SHUTDOWN' });
        setTimeout(() => { peer.destroy(); document.getElementById('status').innerText = "🛑 KOPA Shut Down"; }, 200);
      }
    };

    // Keyboard Input + Live Typing Feedback
    const keyboardInput = document.getElementById('keyboard');
    const typedTextDisplay = document.getElementById('typed-text');

    keyboardInput.addEventListener('input', (e) => {
      const val = e.target.value;
      if (val.length > 0) {
        typedTextDisplay.innerText = `"${val}"`;
        if (conn && conn.open) {
          conn.send({ type: 'TYPING', text: val });
        }
      }
    });
  </script>
</body>
</html>
